<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flappy Cole | Nonstop Nonsense</title>

  <link rel="icon" type="image/png" href="../assets/images/favicon.png">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/flappy-cole.css">
  
  <script src="../js/flappy-cole.js" defer></script>
</head>

<body>

  <header class="site-header">
    <div class="header-content">
      <a href="../index.html" class="logo">
        <span class="logo-icon">NN</span>
        <span>Nonstop Nonsense</span>
      </a>

      <nav class="main-nav">
        <a href="../index.html#tools">All Tools</a>
      </nav>
    </div>
  </header>

  <main class="flappy-page">

    <section class="flappy-heading">
      <h1>Flappy Cole</h1>
      <p>Fat cat. Endless obstacles.</p>
    </section>

    <section class="game-container">

      <div class="game-stage">
        <canvas id="game-canvas" width="800" height="500"></canvas>
      </div>

      <div class="game-instructions">
        Press SPACE or click to flap!
      </div>

      <div class="game-controls">

        <div class="game-stats">
          <div id="score-display">Score: 0</div>
          <div id="high-score-display">Best: 0</div>
        </div>

        <div id="game-status">Ready to play!</div>

        <button id="start-button">Start Game</button>

        <div class="audio-controls">

          <div class="audio-control">
            <label for="music-volume">Music</label>

            <div class="audio-control-options">
              <input
                type="range"
                id="music-volume"
                min="0"
                max="1"
                step="0.01"
                value="0.3"
              >

              <button id="music-mute-button">
                Mute
              </button>
            </div>
          </div>

          <div class="audio-control">
            <label for="sfx-volume">Sound Effects</label>

            <input
              type="range"
              id="sfx-volume"
              min="0"
              max="1"
              step="0.01"
              value="0.2"
            >
          </div>

        </div>

      </div>

    </section>

  </main>

  <footer>
    <p>
      <small>&copy; 2026 Nonstop Nonsense. All rights reserved. Sound effects provided by ZapSplat.</small>
    </p>
  </footer>

  <!-- Background Music -->
  <audio
    id="game-music"
    src="../assets/music/flappy-cole.mp3"
    preload="auto"
    loop
  ></audio>

  <!-- Sound Effects -->
  <audio id="flap-sound" src="../assets/sounds/boing.mp3"></audio>
  <audio id="score-sound" src="../assets/sounds/ching.mp3"></audio>
  <audio id="game-over-sound" src="../assets/sounds/lose.mp3"></audio>
  <audio id="high-score-sound" src="../assets/sounds/high-score.mp3"></audio>

</body>

</html>
